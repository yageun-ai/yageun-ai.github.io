<script type="module">
import * as THREE from 'three';

// =====================================================================
//  기본 설정
// =====================================================================
const $ = id => document.getElementById(id);
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const isTouch = matchMedia('(pointer:coarse)').matches;
const LANES = [-2.2, 0, 2.2];
const CW = 9.2, WALL_H = 6, SEG_LEN = 12, SEG_N = 10;
const SPAWN_Z = -100, DESPAWN_Z = 10;
const BASE_SPEED = 13, MAX_SPEED = 40, JUMP_H = 2.0;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const clamp = THREE.MathUtils.clamp, lerp = THREE.MathUtils.lerp;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });

renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;

$('game').appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const FOG_DAY = new THREE.Color(0xf6d2a4), FOG_NIGHT = new THREE.Color(0x231c40);
scene.background = FOG_DAY.clone();
scene.fog = new THREE.Fog(FOG_DAY.clone(), 30, 100);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 220);
const camCfg = { fov: 60, y: 4.0, z: 7.2 };
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h);

    const t = clamp((a - 0.45) / 0.55, 0, 1);
    camCfg.fov = lerp(80, 63, t); camCfg.y = lerp(5.0, 4.2, t); camCfg.z = lerp(8.6, 7.4, t);
  } else { camCfg.fov = 60; camCfg.y = 4.0; camCfg.z = 7.2; }
  camera.fov = camCfg.fov;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

// =====================================================================
//  조명
// =====================================================================
const hemi = new THREE.HemisphereLight(0xfff1de, 0x6d5a48, 0.95);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc68a, 1.7);
sun.position.set(-8, 14, 2);
sun.target.position.set(0, 0, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 50 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);
const SUN_DAY = new THREE.Color(0xffc68a), SUN_NIGHT = new THREE.Color(0x8ea2ff);

// =====================================================================
//  헬퍼: 캔버스 텍스처, 지오메트리/머티리얼 캐시
// =====================================================================
function makeTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  return t;
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const gCache = new Map();
const cached = (k, f) => { if (!gCache.has(k)) gCache.set(k, f()); return gCache.get(k); };
const boxG = (w, h, d) => cached(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d));
const cylG = (a, b, h, s = 18) => cached(`c${a},${b},${h},${s}`, () => new THREE.CylinderGeometry(a, b, h, s));
const planeG = (w, h) => cached(`p${w},${h}`, () => new THREE.PlaneGeometry(w, h));
const mCache = new Map();
function M(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!mCache.has(k)) mCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.05, ...o }));
  return mCache.get(k);
}
function mesh(geo, mat, x = 0, y = 0, z = 0, cast = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true; return m;
}
const glowTex = makeTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const glowMat = c => new THREE.SpriteMaterial({ map: glowTex, color: c, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });

// =====================================================================
//  환경: 바닥 / 벽 / 천장 / 소품
// =====================================================================
const floorTex = makeTex(512, 512, (g, w, h) => {
  g.fillStyle = '#bdb5a8'; g.fillRect(0, 0, w, h);
  const n = 6, ts = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const v = rand(-9, 9), chk = (i + j) % 2 ? 6 : -4;
    g.fillStyle = `rgb(${212 + v + chk},${205 + v + chk},${192 + v + chk})`;
    g.fillRect(i * ts + 2, j * ts + 2, ts - 4, ts - 4);
  }
  for (let k = 0; k < 4000; k++) { g.fillStyle = `rgba(60,40,20,${Math.random() * 0.07})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = 'rgba(255,190,70,.6)';
  for (const x of [-1.1, 1.1]) { const u = (x + CW / 2) / CW * w; for (let y = 8; y < h; y += 64) g.fillRect(u - 3, y, 6, 34); }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(1, 140 / CW);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(CW, 140), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.42, metalness: 0.05 }));
floor.rotation.x = -Math.PI / 2; floor.position.z = -58; floor.receiveShadow = true;
scene.add(floor);

// 왼쪽 벽: 노을 지는 창문
const PX = 1024 / 12;
const WIN = [0, 1, 2].map(i => ({ x: (i * 4 + 0.4) * PX, y: (WALL_H - 4.7) * PX, w: 3.2 * PX, h: 3.6 * PX }));
function wallBase(g, w, h, col) {
  g.fillStyle = col; g.fillRect(0, 0, w, h);
  for (let k = 0; k < 1500; k++) { g.fillStyle = `rgba(0,0,0,${Math.random() * 0.03})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
  g.fillStyle = '#8c7a66'; g.fillRect(0, h - 1.0 * PX, w, 1.0 * PX);
  g.fillStyle = '#6e5e4d'; g.fillRect(0, h - 1.0 * PX, w, 6);
  g.fillStyle = '#3b332c'; g.fillRect(0, h - 0.15 * PX, w, 0.15 * PX);
}
const leftMap = makeTex(1024, 512, (g, w, h) => {
  wallBase(g, w, h, '#e9e2d4');
  for (const r of WIN) {
    g.fillStyle = '#17141e'; g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = '#7d8088'; g.lineWidth = 12; g.strokeRect(r.x, r.y, r.w, r.h);
    g.lineWidth = 7; g.beginPath(); g.moveTo(r.x + r.w / 2, r.y); g.lineTo(r.x + r.w / 2, r.y + r.h);
    g.moveTo(r.x, r.y + r.h * 0.62); g.lineTo(r.x + r.w, r.y + r.h * 0.62); g.stroke();
    g.fillStyle = '#c9c4ba'; g.fillRect(r.x - 10, r.y + r.h + 4, r.w + 20, 10);
  }
});
const leftEmi = makeTex(1024, 512, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  WIN.forEach((r, i) => {
    g.save(); g.beginPath(); g.rect(r.x, r.y, r.w, r.h); g.clip();
    const gr = g.createLinearGradient(0, r.y, 0, r.y + r.h);
    gr.addColorStop(0, '#5a3d8c'); gr.addColorStop(0.45, '#ff8f5a'); gr.addColorStop(0.8, '#ffd08a'); gr.addColorStop(1, '#ffe7b0');
    g.fillStyle = gr; g.fillRect(r.x, r.y, r.w, r.h);
    if (i === 1) { g.fillStyle = '#fff1c4'; g.beginPath(); g.arc(r.x + r.w * 0.6, r.y + r.h * 0.72, 34, 0, 7); g.fill(); }
    let bx = r.x - 10;
    while (bx < r.x + r.w) {
      const bw = rand(26, 60), bh = rand(60, 200);
      g.fillStyle = `rgb(${40 + rand(0, 20)},${30 + rand(0, 15)},${60 + rand(0, 25)})`;
      g.fillRect(bx, r.y + r.h - bh, bw, bh);
      for (let yy = r.y + r.h - bh + 8; yy < r.y + r.h - 6; yy += 12)
        for (let xx = bx + 5; xx < bx + bw - 6; xx += 10)
          if (Math.random() < 0.35) { g.fillStyle = Math.random() < 0.7 ? '#ffe28a' : '#fff6d8'; g.fillRect(xx, yy, 5, 6); }
      bx += bw + rand(2, 10);
    }
    g.restore();
    g.strokeStyle = '#000'; g.lineWidth = 12; g.strokeRect(r.x, r.y, r.w, r.h);
    g.lineWidth = 7; g.beginPath(); g.moveTo(r.x + r.w / 2, r.y); g.lineTo(r.x + r.w / 2, r.y + r.h);
    g.moveTo(r.x, r.y + r.h * 0.62); g.lineTo(r.x + r.w, r.y + r.h * 0.62); g.stroke();
  });
});
const wallMatL = new THREE.MeshStandardMaterial({ map: leftMap, emissiveMap: leftEmi, emissive: 0xffffff, emissiveIntensity: 1.15, roughness: 0.85 });

// 오른쪽 벽: 회의실 문, 화이트보드, 포스터
function poster(g, x, y, w, h, bg, lines, fg = '#fff') {
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(x + 6, y + 6, w, h);

function makeHuman(o) {
  const mats = [];

  hips.add(mesh(boxG(0.1, 0.48, 0.03), mk(o.tie), 0, 0.42, 0.21));
  hips.add(mesh(boxG(0.66, 0.08, 0.4), mk(0x2a2220), 0, 0.04, 0)); // 벨트
  if (o.belly) hips.add(mesh(boxG(0.54, 0.4, 0.16), mk(top), 0, 0.22, 0.24));
  const head = new THREE.Group(); head.position.y = 0.98; hips.add(head);
  head.add(mesh(boxG(0.44, 0.46, 0.42), mk(o.skin), 0, 0.06, 0));
  const dark = mk(0x1a1a1a);
  for (const s of [-1, 1]) head.add(mesh(boxG(0.06, 0.07, 0.02), dark, s * 0.1, 0.1, 0.215, false));
  head.add(mesh(boxG(0.14, 0.03, 0.02), mk(0x8a3a3a), 0, -0.08, 0.215, false));
  if (!o.bald) {
    head.add(mesh(boxG(0.48, 0.14, 0.46), mk(o.hair), 0, 0.33, 0));
    head.add(mesh(boxG(0.48, 0.38, 0.1), mk(o.hair), 0, 0.16, -0.2));
    head.add(mesh(boxG(0.48, 0.08, 0.08), mk(o.hair), 0, 0.27, 0.2));
  } else {
    for (const s of [-1, 1]) head.add(mesh(boxG(0.06, 0.2, 0.32), mk(o.hair), s * 0.24, 0.08, -0.05));
    head.add(mesh(boxG(0.32, 0.03, 0.06), mk(o.hair), 0.02, 0.3, 0.05));
    head.add(mesh(boxG(0.46, 0.18, 0.08), mk(o.hair), 0, 0.06, -0.21));
  }
  if (o.glasses) {
    for (const s of [-1, 1]) {
      const rim = mesh(boxG(0.15, 0.11, 0.02), mk(0x111111), s * 0.1, 0.1, 0.228, false);
      rim.add(mesh(boxG(0.11, 0.07, 0.01), new THREE.MeshStandardMaterial({ color: 0xbfe3ff, roughness: 0.1, metalness: 0.5 }), 0, 0, 0.006, false));
      head.add(rim);
    }
    head.add(mesh(boxG(0.06, 0.02, 0.02), mk(0x111111), 0, 0.11, 0.228, false));
  }
  if (o.angry) for (const s of [-1, 1]) { const b = mesh(boxG(0.15, 0.035, 0.02), dark, s * 0.1, 0.2, 0.232, false); b.rotation.z = s * 0.35; head.add(b); }
  if (o.mustache) head.add(mesh(boxG(0.2, 0.05, 0.03), mk(o.hair), 0, -0.03, 0.225, false));
  const arms = [], legs = [];
  for (const s of [-1, 1]) {
    const p = new THREE.Group(); p.position.set(s * 0.41, 0.72, 0); hips.add(p);
    p.add(mesh(boxG(0.17, 0.62, 0.19), mk(top), 0, -0.28, 0));
    p.add(mesh(boxG(0.14, 0.14, 0.14), mk(o.skin), 0, -0.64, 0));
    arms.push(p);
  }
  for (const s of [-1, 1]) {
    const p = new THREE.Group(); p.position.set(s * 0.17, 0.02, 0); hips.add(p);
    p.add(mesh(boxG(0.24, 0.82, 0.26), mk(o.pants), 0, -0.42, 0));
    p.add(mesh(boxG(0.25, 0.12, 0.36), mk(0x161616), 0, -0.86, 0.05));
    legs.push(p);
  }
  return { root, hips, head, arms, legs, mats };
}

  S.vy = 7; S.grounded = false;
  Snd.crash(); Snd.bgm = false;
  navigator.vibrate && navigator.vibrate([80, 40, 160]);
  flash('#ff2a2a', 0.55);
  _p.set(S.x, 1.0, -0.4);
  burstPapers(_p, 70, [0xffffff, 0xf7f3e8, 0xffe9a8, 0xff9f9f, 0xbfdcff], 1.2);
  sparkle(_p, 30, [0xff5040, 0xffd040, 0xffffff], 7, 0.6, 1.4, 4);
}
function gameOver() {
  S.mode = 'over';
  const min = gameMinutes(), sc = score();
  const isBest = sc > S.best; if (isBest) { S.best = sc; localStorage.setItem('kaltoe_best', sc); }
  const r = REASONS[S.reason] || REASONS.desk;
  const flavor = min < 30 ? '해도 안 졌는데…' : min < 90 ? '저녁은 편의점 삼각김밥으로…' : min < 180 ? '막차는 탈 수 있을까…' : '이쯤 되면 그냥 사무실이 집…';
  $('overReason').innerHTML = `<b style="color:#ffb3b3">${r[0]}</b><br>${r[1]}<br><span style="opacity:.65">${flavor}</span>`;
  $('overTime').textContent = min >= 60 ? `${Math.floor(min / 60)}시간 ${min % 60}분` : `${min}분`;
  const [h, m] = clockStr(min);
  $('overClock').textContent = `18:00 → ${h}:${m}  (실제 ${S.t.toFixed(1)}초)`;
  $('overCoffee').textContent = S.coffee + '잔';
  $('overScore').textContent = sc.toLocaleString();
  $('overBest').textContent = S.best.toLocaleString();
  $('newBest').classList.toggle('on', isBest);
  $('over').classList.add('show');
  hud.classList.remove('show');
  Snd.over(); showBest();
}

// =====================================================================
//  입력: 키보드 + 스와이프
// =====================================================================
function moveLane(d) {
  if (S.mode !== 'play') return;
  const n = clamp(S.lane + d, 0, 2);
  if (n !== S.lane) { S.lane = n; Snd.swish(); }
}
function jump() {
  if (S.mode !== 'play') return;
  if (S.grounded) {
    S.vy = Math.sqrt(2 * gravity() * JUMP_H); S.grounded = false; S.jumpBuf = 0;
    Snd.jump(); dust(_p.set(S.x, 0, 0.1), 10, 1.2);
  } else S.jumpBuf = 0.15;
}
function dive() { if (S.mode === 'play' && !S.grounded) S.vy = Math.min(S.vy, -18); }
addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter'].includes(k)) e.preventDefault();
  if (S.mode === 'title' || S.mode === 'over') { if (k === 'Space' || k === 'Enter') startGame(); return; }
  if (e.repeat) return;
  if (k === 'ArrowLeft' || k === 'KeyA') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'KeyD') moveLane(1);
  else if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') jump();
  else if (k === 'ArrowDown' || k === 'KeyS') dive();
  else if (k === 'KeyM') $('btnMute').click();
});
let touch = null;
const SWIPE = 26;
function onSwipe(dx, dy) {
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
  else if (dy < 0) jump(); else dive();
}
addEventListener('touchstart', e => {
  if (e.target.closest('button')) return;
  e.preventDefault();
  const t = e.changedTouches[0];
  touch = { id: t.identifier, x: t.clientX, y: t.clientY, time: performance.now(), done: false };
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touch || touch.done) return;
  for (const t of e.changedTouches) if (t.identifier === touch.id) {
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Math.hypot(dx, dy) > SWIPE) { touch.done = true; onSwipe(dx, dy); }
  }
}, { passive: false });
addEventListener('touchend', e => {
  if (!touch) return;
  for (const t of e.changedTouches) if (t.identifier === touch.id) {
    if (!touch.done) {
      const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
      if (Math.hypot(dx, dy) > SWIPE) onSwipe(dx, dy);
      else if (performance.now() - touch.time < 350) jump();
    }
    touch = null;
  }
});
$('btnStart').addEventListener('click', startGame);
$('btnRetry').addEventListener('click', startGame);
document.addEventListener('gesturestart', e => e.preventDefault());

// =====================================================================
//  메인 루프
// =====================================================================
const camBase = new THREE.Vector3(2.4, 2.1, -4.6), camLook = new THREE.Vector3(0, 1.3, 0);
camera.position.copy(camBase);
const dPos = new THREE.Vector3(), dLook = new THREE.Vector3();
let last = performance.now(), clockT = 0;

function update(dt, rdt) {
  clockT += rdt;
  // ---- 속도
  if (S.mode === 'play') {
    S.t += dt;
    S.speed = Math.min(MAX_SPEED, BASE_SPEED + S.t * 0.3) * (S.inv > 0 ? 1.2 : 1);
    Snd.bpm = clamp(118 + (S.speed - BASE_SPEED) * 1.6, 118, 168);
  } else if (S.mode === 'title') S.speed = 7;
  else S.speed = Math.max(0, S.speed - 45 * dt);
  const dz = S.speed * dt;
  if (S.mode === 'play') S.dist += dz;

  // ---- 시간에 따른 분위기 (노을 → 밤)
  const night = clamp(S.mode === 'title' ? 0 : S.t / 160, 0, 1);
  scene.fog.color.copy(FOG_DAY).lerp(FOG_NIGHT, night); scene.background.copy(scene.fog.color);
  sun.color.copy(SUN_DAY).lerp(SUN_NIGHT, night); sun.intensity = lerp(1.7, 0.9, night);
  hemi.intensity = lerp(0.95, 0.6, night);
  wallMatL.emissiveIntensity = lerp(1.15, 0.7, night);

  // ---- 월드 스크롤
  floorTex.offset.y += dz / CW;
  for (const s of segs) { s.position.z += dz; if (s.position.z > 18) s.position.z -= SEG_N * SEG_LEN; }

  // ---- 스폰
  if (S.mode === 'play') {
    S.rowCD -= dz;
    while (S.rowCD <= 0) { const g = nextGap(); spawnRow(SPAWN_Z - S.rowCD, g); S.rowCD += g; }
  }

  // ---- 플레이어
  const tx = LANES[S.lane];
  if (S.mode !== 'dying' && S.mode !== 'over') S.x += (tx - S.x) * Math.min(1, dt * 15);
  if (!S.grounded) {
    S.vy -= gravity() * dt; S.y += S.vy * dt;
    if (S.y <= 0) {
      S.y = 0; S.vy = 0; S.grounded = true;
      if (S.mode === 'play') {
        S.trauma = Math.max(S.trauma, 0.12); Snd.land(); dust(_p.set(S.x, 0, 0.1), 12, 1.3);
        if (S.jumpBuf > 0) jump();
      }
    }
  }
  S.jumpBuf = Math.max(0, S.jumpBuf - dt);
  playerObj.position.x = S.x; playerObj.position.y = S.y;
  const P = player;
  if (S.mode === 'dying' || S.mode === 'over') {
    playerObj.rotation.x = lerp(playerObj.rotation.x, 1.45, Math.min(1, dt * 6));
    playerObj.position.z = Math.min(1.4, playerObj.position.z + dt * 3);
    P.legs[0].rotation.x = lerp(P.legs[0].rotation.x, -0.5, dt * 5); P.legs[1].rotation.x = lerp(P.legs[1].rotation.x, 0.3, dt * 5);
    P.arms[0].rotation.x = lerp(P.arms[0].rotation.x, -2.8, dt * 5); P.arms[1].rotation.x = lerp(P.arms[1].rotation.x, -2.6, dt * 5);
    playerObj.rotation.z = lerp(playerObj.rotation.z, 0, dt * 4);
  } else {
    S.runPhase += dt * (7 + S.speed * 0.32);
    const sp = Math.sin(S.runPhase);
    if (S.grounded) {
      P.legs[0].rotation.x = sp * 0.95; P.legs[1].rotation.x = -sp * 0.95;
      P.arms[0].rotation.x = -sp * 0.85; P.arms[1].rotation.x = sp * 0.6;
      P.arms[0].rotation.z = P.arms[1].rotation.z = 0;
      P.hips.position.y = 0.9 + Math.abs(Math.cos(S.runPhase)) * 0.08;
      P.hips.rotation.x = 0.16;
      S.dustT -= dt;
      if (S.dustT <= 0 && S.mode === 'play') { S.dustT = 0.07; dust(_p.set(S.x, 0, 0.25), 1, 0.6); }
    } else {
      P.legs[0].rotation.x = lerp(P.legs[0].rotation.x, -1.0, dt * 12); P.legs[1].rotation.x = lerp(P.legs[1].rotation.x, 0.6, dt * 12);
      P.arms[0].rotation.x = lerp(P.arms[0].rotation.x, -2.7, dt * 12); P.arms[1].rotation.x = lerp(P.arms[1].rotation.x, -2.4, dt * 12);
      P.arms[0].rotation.z = -0.3; P.arms[1].rotation.z = 0.3;
      P.hips.rotation.x = 0.05;
    }
    playerObj.rotation.z = clamp(-(tx - S.x) * 0.22, -0.4, 0.4);
    playerObj.rotation.x = 0; playerObj.position.z = 0;
  }

  // ---- 무적
  if (S.inv > 0) {
    S.inv -= dt;
    const blink = S.inv < 1.2 ? (Math.sin(clockT * 30) > 0 ? 1 : 0.2) : 1;
    const pulse = (0.35 + Math.sin(clockT * 10) * 0.15) * blink;
    player.mats.forEach(m => m.emissive.setRGB(pulse, pulse * 0.7, 0.05));
    aura.visible = true; aura.material.opacity = 0.75 * blink; aura.scale.setScalar(3.2 + Math.sin(clockT * 12) * 0.3);
    if (Math.random() < 0.7) glowFx.emit(_p.set(S.x + rand(-0.4, 0.4), S.y + rand(0.2, 1.6), 0.3), _v.set(rand(-0.5, 0.5), rand(0, 1), rand(4, 8)), pick([0xffd04a, 0xfff2a8, 0xff9f1c]), 0.5, 1, 0, 1);
    if (S.inv <= 0) { S.inv = 0; player.mats.forEach(m => m.emissive.setHex(0)); aura.visible = false; }
  }

  // ---- 오브젝트 이동 & 충돌
  for (let i = objs.length - 1; i >= 0; i--) {
    const o = objs[i], g = o.g;
    g.position.z += dz;
    if (o.flying) {
      o.vel.y -= 25 * dt; g.position.addScaledVector(o.vel, dt);
      g.rotation.x += o.av.x * dt; g.rotation.y += o.av.y * dt; g.rotation.z += o.av.z * dt;
      if (g.position.y < -6 || g.position.z > DESPAWN_Z + 10) { scene.remove(g); objs.splice(i, 1); }
      continue;
    }
    if (g.position.z > DESPAWN_Z) { scene.remove(g); objs.splice(i, 1); continue; }
    const z = g.position.z;
    if (o.kind === 'obs') {
      if (o.lamp) o.lamp.visible = Math.sin(clockT * 8 + o.x) > 0;
      if (o.type === 'boss') {
        const H = o.human;
        if (!o.popped && z > o.popZ && S.mode === 'play') {
          o.popped = true; g.visible = true; Snd.boss();
          S.trauma = Math.max(S.trauma, 0.25); dust(_p.set(o.x, 0.1, z), 22, 2.2);
          if (S.bossSeen++ < 2 || Math.random() < 0.3) toast('⚠️ 팀장님 등장!', '#ff6b6b');
        }
        if (o.popped) {
          o.popT = Math.min(1, o.popT + dt * 3);
          const e = 1 + 2.7 * Math.pow(o.popT - 1, 3) + 1.7 * Math.pow(o.popT - 1, 2); // easeOutBack
          g.position.y = lerp(-2.5, 0, e) + Math.sin(o.popT * Math.PI) * 0.6;
          const wave = Math.sin(clockT * 12 + o.x);
          H.arms[0].rotation.z = -2.5 - wave * 0.35; H.arms[1].rotation.z = 2.5 - wave * 0.35;
          H.head.rotation.z = wave * 0.08;
          o.bang.scale.setScalar(0.8 + Math.abs(Math.sin(clockT * 9)) * 0.25);
          o.bubble.position.y = 3.1 + Math.sin(clockT * 4) * 0.06;
        }
      }
      if (S.mode === 'play' && (o.type !== 'boss' || o.popped)) {
        if (Math.abs(z) < o.d / 2 + 0.28 && Math.abs(o.x - S.x) < o.w / 2 + 0.26 && S.y < o.h - 0.05) {
          if (S.inv > 0) smash(o); else crash(o);
        }
      }
    } else {
      g.rotation.y += dt * (o.kind === 'ticket' ? 2.2 : 2.8);
      g.position.y = o.baseY + Math.sin(clockT * 3.2 + o.ph) * 0.12;
      if (S.mode === 'play' && Math.abs(z) < 0.85 && Math.abs(o.x - S.x) < 0.95 && g.position.y > S.y - 0.35 && g.position.y < S.y + 1.95) {
        scene.remove(g); objs.splice(i, 1);
        if (o.kind === 'coffee') {
          S.coffee++; S.bonus += 25; Snd.coffee();
          sparkle(g.position, 14, [0xffd9a0, 0xffffff, 0xc98a4b], 3.5, 0.6, 1, 1);
          popText(g.position, '+25 ☕', '#ffe0b0');
        } else {
          S.inv = 5; Snd.ticket(); flash('#ffd36b', 0.5); S.trauma = Math.max(S.trauma, 0.3);
          sparkle(g.position, 50, [0xffd04a, 0xfff2a8, 0xffffff, 0xff9f1c], 7, 0.9, 1.4, 1);
          toast('🎫 칼퇴권 발동! 무적!', '#ffd166');
        }
      }
    }
  }

  // ---- 사망 연출
  if (S.mode === 'dying') {
    S.dieT += rdt;
    if (S.dieT > 0.7) S.timeScale = Math.min(1, S.timeScale + rdt * 2);
    if (S.dieT > 1.5) gameOver();
  }

  paperFx.update(dt, dz); glowFx.update(dt, dz);

  // ---- 카메라
  if (S.mode === 'title') { dPos.set(2.4, 2.1, -4.6); dLook.set(0, 1.3, 0); }
  else if (S.mode === 'play') { dPos.set(S.x * 0.55, camCfg.y + S.y * 0.25, camCfg.z); dLook.set(S.x * 0.35, 1.2 + S.y * 0.2, -7); }
  else { dPos.set(S.x * 0.5 + 1.8, 3.4, 5.6); dLook.set(S.x, 0.6, 0.8); }
  const rate = S.mode === 'play' ? (S.t < 1.3 ? 3 : 9) : 2.2;
  const k = 1 - Math.exp(-rdt * rate);
  camBase.lerp(dPos, k); camLook.lerp(dLook, k);
  S.trauma = Math.max(0, S.trauma - rdt * 1.6);
  const sh = S.trauma * S.trauma;
  camera.position.copy(camBase).add(_v.set(rand(-1, 1) * sh * 0.5, rand(-1, 1) * sh * 0.4, 0));
  camera.lookAt(camLook);
  camera.rotation.z += rand(-1, 1) * sh * 0.06;
  const fovT = camCfg.fov + (S.mode === 'play' ? (S.speed - BASE_SPEED) * 0.22 + (S.inv > 0 ? 6 : 0) : 0);
  S.fov = lerp(S.fov, fovT, 1 - Math.exp(-rdt * 4));
  if (Math.abs(camera.fov - S.fov) > 0.01) { camera.fov = S.fov; camera.updateProjectionMatrix(); }

  if (S.mode === 'play') updateHUD();
}
function smash(o) {
  o.flying = true;
  o.vel = new THREE.Vector3((o.x - S.x || rand(-1, 1)) * 3 + rand(-3, 3), rand(8, 12), -S.speed * 0.9);
  o.av = new THREE.Vector3(rand(-8, 8), rand(-8, 8), rand(-8, 8));
  S.bonus += 50; S.trauma = Math.max(S.trauma, 0.4); Snd.smash();
  if (o.type === 'boss') o.g.visible = true;
  _p.set(o.x, 1, o.g.position.z);
  burstPapers(_p, 26, undefined, 1); sparkle(_p, 18, [0xffd04a, 0xffffff], 6, 0.5, 1.2, 3);
  popText(_p, o.type === 'boss' ? '팀장님 패스! +50' : '퍽! +50', '#ffd166');
}

function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  update(rdt * S.timeScale, rdt);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
